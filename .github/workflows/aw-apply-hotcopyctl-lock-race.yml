name: AW apply hotcopyctl lock-race patch

on:
  push:
    branches:
      - aw/AW-CODE-20260907-hotcopyctl-lock-race

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aw/AW-CODE-20260907-hotcopyctl-lock-race
          fetch-depth: 0
      - name: Apply deterministic source transform and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('perl/bin/hotcopyctl')
          s = p.read_text()
          replacements = [
              ("use Getopt::Long qw(GetOptions);\n", "use Getopt::Long qw(GetOptions);\nuse Fcntl qw(O_CREAT O_RDWR :flock :seek);\n"),
              ("  --force / --no-force       Allow/disallow stale lockfile removal (default: allow)\n", "  --force / --no-force       Legacy compatibility; advisory-lock recovery is automatic\n"),
              ("my $lock_owned = 0;\nmy $did_backup = 0;\n", "my $lock_owned = 0;\nmy $lock_handle;\nmy $did_backup = 0;\n"),
              ('''sub acquire_lock {\n    return if $DryRun;\n\n    if (-e $lock_file) {\n        open(my $fh, '<', $lock_file)\n            or die "hotcopyctl FATAL: Unable to open lockfile $lock_file: $!\\n";\n        my $old_pid = <$fh>;\n        close($fh);\n        chomp($old_pid //= '');\n\n        if ($old_pid =~ /^\\d+$/ && kill(0, $old_pid)) {\n            die "hotcopyctl FATAL: Another hotcopyctl process is running under PID $old_pid\\n";\n        }\n        if (!$ForceRemoveLockfile) {\n            die "hotcopyctl FATAL: Stale or invalid lockfile $lock_file exists; rerun with --force or remove it manually\\n";\n        }\n        log_warn("hotcopyctl WARN: Removing stale lockfile $lock_file");\n        unlink($lock_file)\n            or die "hotcopyctl FATAL: Could not remove stale lockfile $lock_file: $!\\n";\n    }\n\n    open(my $fh, '>', $lock_file)\n        or die "hotcopyctl FATAL: Could not create lockfile $lock_file: $!\\n";\n    print {$fh} "$$\\n";\n    close($fh);\n    $lock_owned = 1;\n}\n\nsub release_lock {\n    return unless $lock_owned && -e $lock_file;\n    if (open(my $fh, '<', $lock_file)) {\n        my $pid = <$fh>;\n        close($fh);\n        chomp($pid //= '');\n        unlink($lock_file) if $pid eq "$$";\n    }\n    $lock_owned = 0;\n}\n''', '''sub acquire_lock {\n    return if $DryRun;\n\n    # Hold an advisory lock on a persistent inode for the process lifetime.\n    # The historical check-then-create PID file was racy: two simultaneous\n    # processes could both observe "no lock" and both become owners.\n    sysopen(my $fh, $lock_file, O_RDWR | O_CREAT, 0600)\n        or die "hotcopyctl FATAL: Could not create lockfile $lock_file: $!\\n";\n\n    if (!flock($fh, LOCK_EX | LOCK_NB)) {\n        seek($fh, 0, SEEK_SET);\n        my $old_pid = <$fh>;\n        close($fh);\n        chomp($old_pid //= '');\n        my $owner = $old_pid =~ /^\\d+$/ ? " under PID $old_pid" : '';\n        die "hotcopyctl FATAL: Another hotcopyctl process is running$owner\\n";\n    }\n\n    seek($fh, 0, SEEK_SET)\n        or die "hotcopyctl FATAL: Could not seek lockfile $lock_file: $!\\n";\n    truncate($fh, 0)\n        or die "hotcopyctl FATAL: Could not truncate lockfile $lock_file: $!\\n";\n    print {$fh} "$$\\n"\n        or die "hotcopyctl FATAL: Could not write lockfile $lock_file: $!\\n";\n\n    $lock_handle = $fh;\n    $lock_owned = 1;\n}\n\nsub release_lock {\n    return unless $lock_owned && $lock_handle;\n    flock($lock_handle, LOCK_UN);\n    close($lock_handle);\n    undef $lock_handle;\n    $lock_owned = 0;\n}\n''')
          ]
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one source match, found {n}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          perl -c perl/bin/hotcopyctl
          git diff --check
      - name: Commit only the source repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .aw/AW-CODE-20260907-hotcopyctl-lock-race.patch
          git rm .github/workflows/aw-apply-hotcopyctl-lock-race.yml
          git config user.name "Corey Zelinski"
          git config user.email "Corey.Zelinski@IEEE.org"
          git add perl/bin/hotcopyctl
          git diff --cached --check
          git commit -m "Make hotcopyctl lock acquisition race-free - cvz"
          git push origin HEAD:aw/AW-CODE-20260907-hotcopyctl-lock-race
